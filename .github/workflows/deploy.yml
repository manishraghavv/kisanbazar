# ─────────────────────────────────────────────────────────────
#  DEPLOY — Multi-Vendor Agri-Commerce CI/CD Pipeline
#  Trigger: push to main → lint → typecheck → build → deploy
# ─────────────────────────────────────────────────────────────

name: Deploy to EC2

on:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  id-token: write

jobs:
  lint-and-build:
    name: Lint, TypeCheck & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # ═══════════════════════════════════
      #  BACKEND
      # ═══════════════════════════════════
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npm run prisma:generate
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Backend TypeScript type check
        working-directory: ./backend
        run: npx tsc --noEmit

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      # ═══════════════════════════════════
      #  FRONTEND
      # ═══════════════════════════════════
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend ESLint
        working-directory: ./frontend
        run: npm run lint

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_ENABLE_SOCKET: ${{ secrets.NEXT_PUBLIC_ENABLE_SOCKET || 'true' }}

      # ═══════════════════════════════════
      #  VALIDATE BUILDS
      # ═══════════════════════════════════
      - name: Validate backend build
        run: |
          if [ ! -d "backend/dist" ]; then
            echo "❌ Backend dist directory not found"
            exit 1
          fi
          if [ ! -f "backend/dist/index.js" ] && [ ! -f "backend/dist/server.js" ]; then
            echo "⚠️  No expected entrypoint found in backend/dist"
            ls -la backend/dist/ 2>/dev/null || true
          fi
          echo "✅ Backend build validated"

      - name: Validate frontend build
        run: |
          if [ ! -d "frontend/.next" ]; then
            echo "❌ Frontend .next directory not found"
            exit 1
          fi
          if [ ! -f "frontend/.next/BUILD_ID" ]; then
            echo "⚠️  BUILD_ID not found in .next"
            ls -la frontend/.next/ 2>/dev/null || true
          fi
          echo "✅ Frontend build validated"

      # ═══════════════════════════════════
      #  UPLOAD ARTIFACTS
      # ═══════════════════════════════════
      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
            backend/prisma/
          retention-days: 1

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: |
            frontend/.next/
            frontend/public/
            frontend/package.json
            frontend/package-lock.json
            frontend/next.config.ts
          retention-days: 1

      - name: Upload deploy scripts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-scripts
          path: |
            deploy.sh
            ecosystem.config.cjs
            DEPLOYMENT.md
          retention-days: 1

  deploy:
    name: Deploy to EC2
    needs: lint-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ensure remote directories exist
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.EC2_PORT || 22 }} \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "mkdir -p ~/app/backend ~/app/frontend ~/app/logs"

      - name: Upload backend to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT || 22 }}" \
            ./artifacts/backend-build/ \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/app/backend/

      - name: Upload frontend to EC2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT || 22 }}" \
            ./artifacts/frontend-build/ \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/app/frontend/

      - name: Upload deploy scripts to EC2
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -p ${{ secrets.EC2_PORT || 22 }}" \
            ./artifacts/deploy-scripts/ \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }}:~/app/

      - name: Execute deployment script on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.EC2_PORT || 22 }} \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "chmod +x ~/app/deploy.sh && cd ~/app && bash deploy.sh"

      - name: Health check
        run: |
          sleep 10
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            -p ${{ secrets.EC2_PORT || 22 }} \
            ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} \
            "curl -s http://localhost:3000/health || echo 'Health check failed'"

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
