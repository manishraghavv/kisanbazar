# ─────────────────────────────────────────────────────────────
#  Multi-Vendor E-commerce Backend — Docker Compose
# ─────────────────────────────────────────────────────────────

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: multivenor-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-multivenor}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-multivenor_secret}
      POSTGRES_DB: ${DB_NAME:-multivenor_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-multivenor} -d ${DB_NAME:-multivenor_db}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: multivenor-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: multivenor-backend
    restart: unless-stopped
    ports:
      - '${PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${DB_USER:-multivenor}:${DB_PASSWORD:-multivenor_secret}@postgres:5432/${DB_NAME:-multivenor_db}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node dist/server.js"

volumes:
  postgres-data:
  redis-data:
